
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "house-pricing"
version = "0.1.0"
description = "functions for King County house data"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["house_pricing"]
package-dir = {house_pricing = "."}